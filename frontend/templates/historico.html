<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📜 Histórico de Briefings | PromptGen Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-rocket"></i>
            <span>PromptGen Pro</span>
        </div>
        <div class="nav-links">
            <a href="/"><i class="fas fa-file-alt"></i> Novo Briefing</a>
            <a href="/historico" class="active"><i class="fas fa-history"></i> Histórico</a>
        </div>
    </nav>

    <main class="main-container historico-page">
        <div class="page-header">
            <h1><i class="fas fa-history"></i> Histórico de Briefings</h1>
            <p>Todos os briefings salvos e seus prompts gerados</p>
        </div>

        <div id="briefingsList" class="briefings-list">
            <div class="loading-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Carregando briefings...</p>
            </div>
        </div>
    </main>

    <!-- Modal de Visualização do Prompt -->
    <div id="promptModal" class="modal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h2><i class="fas fa-file-code"></i> Prompt Completo</h2>
                <button class="modal-close" onclick="fecharPromptModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <pre id="promptFullContent"></pre>
            </div>
            <div class="modal-footer">
                <button class="btn-copy" onclick="copiarPromptModal()"><i class="fas fa-copy"></i> Copiar</button>
                <button class="btn-download" onclick="downloadPromptModal()"><i class="fas fa-download"></i> Download .txt</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage"></span>
    </div>

    <script>
    // Carrega os briefings ao iniciar
    document.addEventListener('DOMContentLoaded', carregarBriefings);

    async function carregarBriefings() {
        const container = document.getElementById('briefingsList');
        try {
            const response = await fetch('/api/briefings');
            const data = await response.json();

            if (!data.sucesso || data.briefings.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>Nenhum briefing salvo</h3>
                        <p>Crie seu primeiro briefing na página <a href="/">Novo Briefing</a></p>
                    </div>
                `;
                return;
            }

            let html = '';
            data.briefings.forEach(b => {
                const dataFormatada = new Date(b.data_preenchimento).toLocaleString('pt-BR');
                html += `
                    <div class="briefing-card">
                        <div class="briefing-info">
                            <h3><i class="fas fa-file-alt"></i> ${b.nome_sistema}</h3>
                            <div class="briefing-meta">
                                <span><i class="fas fa-building"></i> ${b.empresa || 'Sem empresa'}</span>
                                <span><i class="fas fa-tag"></i> ${b.setor || 'Sem setor'}</span>
                                <span><i class="fas fa-calendar"></i> ${dataFormatada}</span>
                            </div>
                            <p class="briefing-preview">${b.prompt_preview || 'Sem preview'}</p>
                        </div>
                        <div class="briefing-actions">
                            <button class="btn-view" onclick="verPrompt(${b.id})">
                                <i class="fas fa-eye"></i> Ver Prompt
                            </button>
                            <button class="btn-delete" onclick="excluirBriefing(${b.id})">
                                <i class="fas fa-trash"></i> Excluir
                            </button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        } catch (error) {
            container.innerHTML = `
                <div class="error-state">
                    <i class="fas fa-exclamation-circle"></i>
                    <h3>Erro ao carregar</h3>
                    <p>${error.message}</p>
                </div>
            `;
        }
    }

    async function verPrompt(id) {
        try {
            const response = await fetch(`/api/briefings/${id}`);
            const data = await response.json();

            if (data.sucesso) {
                document.getElementById('promptFullContent').textContent = data.briefing.prompt;
                document.getElementById('promptModal').style.display = 'flex';
                document.getElementById('promptModal').dataset.prompt = data.briefing.prompt;
                document.getElementById('promptModal').dataset.nome = data.briefing.nome_sistema;
            }
        } catch (error) {
            mostrarToast('Erro ao carregar prompt: ' + error.message, 'error');
        }
    }

    function fecharPromptModal() {
        document.getElementById('promptModal').style.display = 'none';
    }

    async function excluirBriefing(id) {
        if (!confirm('Tem certeza que deseja excluir este briefing?')) return;

        try {
            const response = await fetch(`/api/briefings/${id}`, { method: 'DELETE' });
            const data = await response.json();

            if (data.sucesso) {
                mostrarToast('Briefing excluído com sucesso!');
                carregarBriefings();
            } else {
                mostrarToast('Erro ao excluir: ' + data.erro, 'error');
            }
        } catch (error) {
            mostrarToast('Erro: ' + error.message, 'error');
        }
    }

    function copiarPromptModal() {
        const prompt = document.getElementById('promptModal').dataset.prompt;
        navigator.clipboard.writeText(prompt).then(() => {
            mostrarToast('Prompt copiado para a área de transferência!');
        });
    }

    function downloadPromptModal() {
        const prompt = document.getElementById('promptModal').dataset.prompt;
        const nome = document.getElementById('promptModal').dataset.nome || 'prompt';
        const blob = new Blob([prompt], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `prompt_${nome.toLowerCase().replace(/\s+/g, '_')}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        mostrarToast('Prompt baixado com sucesso!');
    }

    function mostrarToast(mensagem, tipo = 'success') {
        const toast = document.getElementById('toast');
        const msgEl = document.getElementById('toastMessage');
        msgEl.textContent = mensagem;
        toast.className = `toast ${tipo}`;
        toast.style.display = 'flex';
        setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    // Fecha modal ao clicar fora
    window.onclick = function(event) {
        const modal = document.getElementById('promptModal');
        if (event.target === modal) {
            modal.style.display = 'none';
        }
    }
    </script>
</body>
</html>
